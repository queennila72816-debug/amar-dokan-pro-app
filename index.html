<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Amar Dokan Pro - Business Management & POS</title>
    <meta name="description" content="All-in-one smart business management, POS, inventory, multi-branch, accounts, due ledger, and invoice system." />
    <meta property="og:title" content="Amar Dokan Pro - Business Management & POS" />
    <meta property="og:description" content="All-in-one smart business management, POS, inventory, multi-branch, accounts, due ledger, and invoice system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#101B35" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('AMAR_DOKAN_PRO_THEME');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F1F4F9] dark:bg-[#0B1428] text-[#172033] dark:text-white antialiased font-sans selection:bg-[#D6AD60] selection:text-[#0B1428]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
